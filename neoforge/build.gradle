plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('jar') {
    archiveFileName = "${mod_id}-${mod_version}-neo.jar"
    exclude 'cn/blockforge/aatu_exup/gametest/**'
    exclude 'data/aatu_exup/structure/config_test_empty.nbt'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
if (project.hasProperty('configuredConfigTests')) {
    sourceSets.main.java.srcDir 'src/configtest/java'
    sourceSets.main.resources.srcDir 'src/configtest/resources'
}
if (project.hasProperty('configuredTestJar')) {
    dependencies { runtimeOnly files(project.property('configuredTestJar')) }
}
neoForge {
    version = project.neo_version
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    if (project.hasProperty('configuredConfigTests')) {
        runs {
            configTestServer {
                type = 'gameTestServer'
                gameDirectory = project.file(project.hasProperty('configuredTestJar')
                        ? 'build/configtest-with-configured' : 'build/configtest-without-configured')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                jvmArguments.addAll '-Xms128m', '-Xmx768m'
            }
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version, loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
