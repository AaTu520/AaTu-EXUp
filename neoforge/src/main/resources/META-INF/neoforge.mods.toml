modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="AaTu"
description='''使用属性强化书和配置的消耗物品在锻造台强化武器和盔甲，保留原有附魔并随机增加属性。装备拥有可注入的注灵，强化消耗注灵并显示累计属性。注灵书在锻造台中使用配置的消耗物品为装备注入注灵。仅玩家击杀、且最大生命值达标的生物有概率掉落两种书籍。'''
[[mixins]]
config="aatu_exup.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.0,)"
ordering="AFTER"
side="CLIENT"
